name: Build and deploy to GitHub Pages

# Exports the game with Godot 4.7.2 (web, single-threaded so it runs on plain
# GitHub Pages without special headers), runs the headless tests, and deploys
# the result. Deployment only happens from the repository's default branch.
# Enable it under Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz \
            'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests (rules perft, labyrinths, board actions, minigames)
        run: |
          ~/godot/godot --headless --path . res://tests/check.tscn
          ~/godot/godot --headless --path . -s tests/test_chess.gd
          ~/godot/godot --headless --path . res://tests/labs.tscn
          ~/godot/godot --headless --path . res://tests/board.tscn
          ~/godot/godot --headless --path . -s tests/test_date.gd
          ~/godot/godot --headless --path . res://tests/date_flow.tscn
          ~/godot/godot --headless --path . -s tests/test_race.gd
          ~/godot/godot --headless --path . res://tests/race_smoke.tscn
          ~/godot/godot --headless --path . -s tests/test_cards.gd
          ~/godot/godot --headless --path . res://tests/card_screen.tscn
          ~/godot/godot --headless --path . -s tests/test_survival.gd
          ~/godot/godot --headless --path . res://tests/survival_flow.tscn

      - name: Export for the web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
